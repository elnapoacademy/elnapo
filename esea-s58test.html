<!-- ================= MATCH HERO ================= -->

<section class="match-hero">

    <div class="match-hero-bg"></div>

    <div class="match-hero-overlay"></div>

    <div class="match-hero-content">

        <img src="assets/img/esea-logo.png" class="match-esea-logo">

        <span>ESEA SEASON 58</span>

        <h1>ELNAPO MATCH HISTORY</h1>

        <p>
            Усі офіційні матчі сезону.
        </p>

    </div>

</section>



<!-- ================= MATCHES ================= -->

<section class="matches-page">

    <div class="matches-container">

        <!-- WIN -->

        <div class="match-card win">

            <div class="match-left">

                <div class="team">

                    <img src="assets/img/teamlogo/elnapo-logo.jpg">

                    <span>ELNAPO</span>

                </div>

            </div>

            <div class="match-center">

                <div class="score">

                    <span class="score-win">13</span>

                    <span class="dash">:</span>

                    <span>7</span>

                </div>

                <div class="match-info">

                    BO1 • Ancient

                </div>

            </div>

            <div class="match-right">

                <div class="team enemy">

                    <img src="assets/img/teamlogo/japa-logo.png">

                    <span>Japa eSports</span>

                </div>

            </div>

            <a href="https://www.faceit.com/"
               target="_blank"
               class="details-btn">

                Детальніше

            </a>

        </div>



        <!-- LOSE -->

        <div class="match-card lose">

            <div class="match-left">

                <div class="team">

                    <img src="assets/img/teamlogo/elnapo-logo.jpg">

                    <span>ELNAPO</span>

                </div>

            </div>

            <div class="match-center">

                <div class="score">

                    <span>9</span>

                    <span class="dash">:</span>

                    <span class="score-lose">13</span>

                </div>

                <div class="match-info">

                    BO3 • Mirage

                </div>

            </div>

            <div class="match-right">

                <div class="team enemy">

                    <img src="assets/img/teamlogo/enemy-logo.png">

                    <span>Infinity Talent</span>

                </div>

            </div>

            <a href="https://www.faceit.com/"
               target="_blank"
               class="details-btn">

                Детальніше

            </a>

               </div> <!-- конец второй карточки -->

    </div> <!-- matches-container -->

</section> <!-- matches-page -->
